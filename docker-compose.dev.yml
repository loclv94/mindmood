services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:16-alpine
    container_name: mindmood-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmood_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mindmood}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mindmood} -d ${POSTGRES_DB:-mindmood}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindmood-dev-network

  # Next.js Web Application (Development with hot reload)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: mindmood-web-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindmood}:${POSTGRES_PASSWORD:-mindmood_dev_password}@postgres:5432/${POSTGRES_DB:-mindmood}?schema=public
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mindmood-dev-network
    command: npm run dev

volumes:
  postgres_dev_data:
    driver: local

networks:
  mindmood-dev-network:
    driver: bridge
